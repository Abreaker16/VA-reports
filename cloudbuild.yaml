# Cloud Build configuration for deploying to Cloud Run
steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/va-reports-backend:$_TAG', './backend']

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/va-reports-backend:$_TAG']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'va-reports-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/va-reports-backend:$_TAG'
      - '--platform'
      - 'managed'
      - '--region'
      - '$_REGION'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300s'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

  # Step 4: Grant SCC Viewer role to Cloud Run service account
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud projects add-iam-policy-binding $PROJECT_ID \
          --member="serviceAccount:$(gcloud iam service-accounts list --filter='email:compute@developer.gserviceaccount.com' --format='value(email)')" \
          --role='roles/securitycenter.findingsViewer' \
          --condition=None || echo "Service account binding skipped"

images:
  - 'gcr.io/$PROJECT_ID/va-reports-backend:$_TAG'

substitutions:
  _TAG: 'latest'
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  timeout: 1200s
